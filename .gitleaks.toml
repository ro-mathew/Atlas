# Reviewed upstream false positives only; never exempt entire source/test trees.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact reviewed upstream source or synthetic fixture line"
condition = "AND"
regexTarget = "line"
paths = ["(?:^|/)packages/app/src/runtime/i18n/language\\.tsx$"]
regexes = ["(?m)^type\\ PluralKey\\ =\\ AppI18nPluralKey\\ \\|\\ UiI18nPluralKey$"]

[[rules.allowlists]]
description = "Exact reviewed upstream source or synthetic fixture line"
condition = "AND"
regexTarget = "line"
paths = ["(?:^|/)packages/app/src/shell/titlebar/tab\\-strip\\.tsx$"]
regexes = ["(?m)^\\ \\ \\ \\ \\ \\ keybind:\\ \"shift\\+alt\\+arrowdown\",$", "(?m)^\\ \\ \\ \\ \\ \\ keybind:\\ \"shift\\+alt\\+arrowup\",$"]

[[rules.allowlists]]
description = "Exact reviewed upstream source or synthetic fixture line"
condition = "AND"
regexTarget = "line"
paths = ["(?:^|/)packages/cli\\-rs/crates/api/tests/all/api\\.rs$"]
regexes = ["(?m)^\\ \\ \\ \\ assert_eq!\\(request\\.url\\.query\\(\\),\\ Some\\(\"auth_token=b3BlbmNvZGU6c2VjcmV0\"\\)\\);$"]

[[rules.allowlists]]
description = "Exact reviewed upstream source or synthetic fixture line"
condition = "AND"
regexTarget = "line"
paths = ["(?:^|/)packages/http\\-recorder/test/redaction\\.test\\.ts$"]
regexes = ["(?m)^\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ url:\\ \"https://example\\.test/path\\?key=sk\\-123456789012345678901234\",$", "(?m)^\\ \\ \\ \\ \\ \\ \\ \\ metadata:\\ \\{\\ token:\\ \"sk\\-123456789012345678901234\"\\ \\},$"]

